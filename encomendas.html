<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encomendas | Ateliê da Margo</title>
    <link rel="stylesheet" href="css/e-commercy.css">
    <link rel="stylesheet" href="css/encomendas.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/Ateliê_da_Margo_em_Crochê-removebg-preview.png" alt="Logo Ateliê da Margo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="encomendas.html">Encomendas</a></li>
                <li><a href="sobre.html">Sobre nós</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
        <a href="carrinho.html" class="carrinho">🛒 <span id="contador-carrinho">0</span></a>
    </header>

    <main>
        <section class="pagina-produtos">
            <p class="subtitulo">ENCOMENDAS</p>
            <h1>Faça sua encomenda</h1>
            <p>Preencha os campos e envie o pedido direto no WhatsApp.</p>
        </section>

        <form id="form-encomenda" class="form-encomenda">
            <label for="nome">Seu nome
                <input type="text" id="nome" required>
            </label>

            <label for="produto">Produto
                <select id="produto" required>
                    <option value="">Escolha uma peça</option>
                    <option>Jogo de banheiro</option>
                    <option>Tapete</option>
                    <option>Sousplat</option>
                    <option>Centro de mesa</option>
                    <option>Caminho de mesa</option>
                </select>
            </label>

            <label for="cores">Cores desejadas
                <input type="text" id="cores" placeholder="Ex.: vermelho cru e dourado">
            </label>

           <label for="tamanho">Tamanho
    <select id="tamanho" disabled>
        <option value="">Escolha o produto primeiro</option>
    </select>
</label>

            <label for="detalhes">Detalhes do pedido
                <textarea id="detalhes" rows="4"></textarea>
            </label>

            <div class="botoes-envio">
    <button type="submit" class="botao">ENVIAR PELO WHATSAPP</button>
    <a href="https://instagram.com/eoo_igorcb" target="_blank" rel="noopener noreferrer"><button type="button" id="btn-instagram" class="botao">ENVIAR PELO INSTAGRAM</button></a>
    <a href="mailto:igorcastilhobittencourt11@gmail.com?subject=Interesse%20em%20encomendas&body=Olá,%20tenho%20interesse%20em%20fazer%20uma%20encomenda." target="_blank" rel="noopener noreferrer"><button type="button" id="btn-email" class="botao">ENVIAR POR E-MAIL</button></a>
</div>
        </form>
    </main>

    <footer>
        <p>© 2026 Ateliê da Margo. Todos os direitos reservados.</p>
    </footer>
<script src="js/carrinho.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
